[defaults]
inventory = inventory.yml
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
# Facts are read via ansible_facts['x'] rather than the auto-injected
# ansible_x top-level variables, which ansible-core is removing in 2.24.
inject_facts_as_vars = False
# Note: the yaml stdout callback and profile_tasks live in collections, not in
# ansible-core, so they are deliberately not enabled here.
# The Zero 2 W is slow to wake its WiFi after idle.
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15
