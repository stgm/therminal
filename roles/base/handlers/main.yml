---
- name: Restart sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Re-execute systemd
  ansible.builtin.command: systemctl daemon-reexec
  changed_when: true

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
